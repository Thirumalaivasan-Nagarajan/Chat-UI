<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat UI</title>
  <style>
    /* Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Chat container */
    .chat-container {
      width: 400px;
      max-width: 100%;
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Chat header */
    .chat-header {
      background: #4f46e5;
      color: white;
      padding: 1rem;
      text-align: center;
      font-weight: bold;
    }

    /* Messages */
    .chat-messages {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 1rem;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.bot {
      justify-content: flex-start;
    }

    .message .text {
      max-width: 70%;
      padding: 0.75rem 1rem;
      border-radius: 15px;
      background: #e5e7eb;
      color: #111827;
    }

    .message.user .text {
      background: #4f46e5;
      color: white;
      border-bottom-right-radius: 0;
    }

    .message.bot .text {
      background: #e5e7eb;
      color: #111827;
      border-bottom-left-radius: 0;
    }

    /* Chat input */
    .chat-input {
      display: flex;
      border-top: 1px solid #ddd;
    }

    .chat-input input {
      flex: 1;
      padding: 1rem;
      border: none;
      outline: none;
    }

    .chat-input button {
      padding: 1rem 1.5rem;
      background: #4f46e5;
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }

    .chat-input button:hover {
      background: #3730a3;
    }

  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">Chat with Support</div>
    <div class="chat-messages" id="chatMessages">
      <div class="message bot">
        <div class="text">Hello! How can I help you today?</div>
      </div>
    </div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type a message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');

    function sendMessage() {
      const message = userInput.value.trim();
      if (message === '') return;

      // Add user message
      const userMessage = document.createElement('div');
      userMessage.classList.add('message', 'user');
      userMessage.innerHTML = `<div class="text">${message}</div>`;
      chatMessages.appendChild(userMessage);

      userInput.value = '';
      chatMessages.scrollTop = chatMessages.scrollHeight;

      // Simulate bot reply
      setTimeout(() => {
        const botMessage = document.createElement('div');
        botMessage.classList.add('message', 'bot');
        botMessage.innerHTML = `<div class="text">You said: ${message}</div>`;
        chatMessages.appendChild(botMessage);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, 1000);
    }

    userInput.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
